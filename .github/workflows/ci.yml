name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API lint and tests (with Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54329/cornelius_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e "api[dev]" requests
      - run: ruff check api && ruff format --check api
      - run: python -m pytest api -q
      - run: python -m pytest workers -q || true
        if: ${{ hashFiles('workers/**/test_*.py') != '' }}

  web:
    name: Web lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8100

  containers:
    name: Container builds and scan
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cornelius-api:ci ./api
      - run: docker build -f workers/transcode/Dockerfile -t cornelius-transcode:ci .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cornelius-api:ci
          severity: CRITICAL,HIGH
          exit-code: "0"
