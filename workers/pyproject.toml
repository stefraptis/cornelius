# Lint settings for the workers package (run `ruff check workers` from the repo root).
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "W"]
# ffmpeg is invoked with fixed argument lists; paths come from our own temp dirs.
ignore = ["S101", "S603", "S607"]
